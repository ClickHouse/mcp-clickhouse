name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.test_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: Python 3.10 / minimum clickhouse-connect 1.0.0
            python_version: "3.10"
            clickhouse_connect: "1.0.0"
            dependency_mode: minimum
            lint: false
          - test_name: Python 3.11 / locked dependencies
            python_version: "3.11"
            dependency_mode: locked
            lint: false
          - test_name: Python 3.12 / locked dependencies and lint
            python_version: "3.12"
            dependency_mode: locked
            lint: true
          - test_name: Python 3.13 / locked dependencies
            python_version: "3.13"
            dependency_mode: locked
            lint: false
          - test_name: Python 3.14 / locked dependencies
            python_version: "3.14"
            dependency_mode: locked
            lint: false

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
        ports:
          - 9000:9000
          - 8123:8123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        run: uv python install "${{ matrix.python_version }}"

      - name: Install Project
        run: uv sync --python "${{ matrix.python_version }}" --locked --all-extras --dev

      - name: Build package
        if: matrix.lint
        run: uv build

      - name: Install minimum clickhouse-connect
        if: matrix.dependency_mode == 'minimum'
        run: uv pip install "clickhouse-connect==${{ matrix.clickhouse_connect }}"

      - name: Run tests
        env:
          CLICKHOUSE_HOST: "localhost"
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: "default"
          CLICKHOUSE_PASSWORD: "clickhouse"
          CLICKHOUSE_SECURE: "false"
          CLICKHOUSE_VERIFY: "false"
          CHDB_ENABLED: "true"
        run: |
          uv run --python "${{ matrix.python_version }}" --no-sync pytest tests

      - name: Lint with Ruff
        if: matrix.lint
        run: uv run --python "${{ matrix.python_version }}" --no-sync ruff check .

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: mcp-clickhouse:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image import
        run: |
          docker run --rm mcp-clickhouse:test python -c "import mcp_clickhouse; print('✅ MCP ClickHouse Docker image works!')"

      - name: Test Docker image default command
        run: |
          timeout 10s docker run --rm \
            -e CLICKHOUSE_HOST=localhost \
            -e CLICKHOUSE_USER=default \
            -e CLICKHOUSE_PASSWORD="" \
            mcp-clickhouse:test || [ $? = 124 ] && echo "✅ Docker container starts successfully"
