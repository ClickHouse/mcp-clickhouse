[project]
name = "mcp-clickhouse"
version = "0.5.0"
description = "An MCP server for ClickHouse."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
     "fastmcp==4.0.1",
     "python-dotenv>=1.0.1",
     "clickhouse-connect>=0.8.16",
     "truststore>=0.10",
     "cachetools>=5.5.0",
     "uvicorn>=0.31.0",
     "simplejson>=3.17.2,<5",
     "starlette>=1.0.1",
     "mcp>=2.0.0,<3.0.0",
     "pydantic>=2.0",
]

[project.scripts]
mcp-clickhouse = "mcp_clickhouse.main:main"

[project.urls]
Home = "https://github.com/ClickHouse/mcp-clickhouse"

[project.optional-dependencies]
chdb = [
    "chdb>=3.3.0"
]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio"
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_clickhouse"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Every DeprecationWarning is a failure so a FastMCP or MCP SDK deprecation is caught
# at the pin bump, not at removal time. See MIGRATION_DECISIONS.md D6 and D19.
# Later entries win. The one ignore is clickhouse-connect's compiled buffer module
# (0.15.x) importing array type code 'u', which Python 3.13 deprecates for 3.16;
# it is not this project's code. Drop the ignore once clickhouse-connect fixes it.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:The 'u' type code is deprecated:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
